<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healer and Destroyer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #152337, #081018 55%, #03070b 100%);
        color: #e9f2ff;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      #minimap {
        position: fixed;
        top: 16px;
        right: 16px;
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        background: rgba(5, 10, 16, 0.72);
        border: 1px solid rgba(132, 204, 255, 0.25);
        border-radius: 14px;
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      #minimap.hidden,
      #minimap.suppressed {
        display: none;
      }

      .minimap-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      .minimap-header .panel-title {
        margin: 0;
      }

      .minimap-summary,
      .minimap-hint {
        font-size: 0.72rem;
        color: rgba(233, 242, 255, 0.6);
      }

      .minimap-canvas {
        display: block;
        background: rgba(2, 5, 9, 0.85);
        border-radius: 6px;
        image-rendering: pixelated;
      }

      #notifications {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 10px;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      #framerate {
        position: fixed;
        left: max(16px, calc(100vw - 392px));
        bottom: 16px;
        display: none;
        width: 360px;
        max-width: calc(100vw - 32px);
        color: #ffe45c;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.35;
        white-space: pre;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(3, 7, 11, 0.68);
        border: 1px solid rgba(255, 228, 92, 0.24);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        text-align: left;
      }

      #framerate.visible {
        display: block;
      }

      .toast {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(111, 234, 208, 0.28);
        background: rgba(8, 18, 24, 0.88);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .toast-title {
        margin: 0 0 4px;
        color: #73f3ca;
        font-size: 0.92rem;
      }

      .toast.warning {
        border-color: rgba(255, 140, 107, 0.35);
      }

      .toast.warning .toast-title {
        color: #ffb7a6;
      }

      .toast.success .toast-title {
        color: #73f3ca;
      }

      .toast-body {
        margin: 0;
        color: rgba(233, 242, 255, 0.82);
        font-size: 0.86rem;
      }

      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8cc8ff;
      }

      /* Blueprint UI: engineering-drawing panels (blue grid paper, white linework) shared by the
         Mission HUD and Builder Site. Colours live in the custom properties on .ui-panel. */
      .ui-panel {
        --bp-paper: #0d3a6e;
        --bp-ink: #ffffff;
        --bp-text: #eaf3ff;
        --bp-muted: rgba(220, 236, 255, 0.65);
        --bp-rule: rgba(255, 255, 255, 0.25);
        --bp-track: rgba(255, 255, 255, 0.14);
        --bp-energy: #ffe27a;
        --bp-ok: #9cffd9;
        --bp-warn: #ffe27a;
        --bp-danger: #ff8f8f;
        --bp-display: "Orbitron", "Trebuchet MS", sans-serif;
        --bp-mono: "IBM Plex Mono", ui-monospace, monospace;
        position: fixed;
        top: 16px;
        box-sizing: border-box;
        padding: 18px 20px;
        font-family: var(--bp-mono);
        font-size: 12px;
        line-height: 1.35;
        color: var(--bp-text);
        background-color: var(--bp-paper);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        outline: 1px solid rgba(255, 255, 255, 0.75);
        outline-offset: -6px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      }

      .ui-panel *,
      .ui-panel *::before,
      .ui-panel *::after {
        box-sizing: border-box;
      }

      #hud {
        left: 16px;
        width: 372px;
      }

      #hud.minimized {
        width: 300px;
      }

      #builder {
        right: 16px;
        width: min(540px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        display: none;
      }

      #builder.visible {
        display: block;
      }

      .ui-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .ui-title {
        font-family: var(--bp-display);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: var(--bp-ink);
      }

      .ui-sub,
      .ui-muted,
      .ui-keys em,
      .ui-stats span,
      .ui-slot span,
      .ui-costs span,
      .ui-stat span,
      .ui-card span,
      .ui-buildtime,
      .ui-picker small {
        color: var(--bp-muted);
      }

      .ui-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--bp-ink);
        margin-bottom: 5px;
      }

      .ui-label::before {
        content: "— ";
      }

      .ui-sec,
      .ui-ship,
      .ui-mounts,
      .ui-summary {
        padding: 8px 0;
        border-top: 1px dashed var(--bp-rule);
      }

      .ui-copy {
        margin: 0;
      }

      .ui-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      .ui-row .ui-label {
        margin: 0;
      }

      .ui-ok {
        color: var(--bp-ok);
      }

      .ui-warn {
        color: var(--bp-warn);
      }

      .ui-panel b {
        font-weight: 600;
      }

      /* Bars: thin white fills on a faint track; energy is yellow, overload is red. */
      .ui-bar {
        height: 6px;
        margin-top: 4px;
        background: var(--bp-track);
        overflow: hidden;
      }

      .ui-bar i {
        display: block;
        height: 100%;
        background: var(--bp-ink);
      }

      .ui-bar-energy i {
        background: var(--bp-energy);
      }

      .ui-bar-danger i {
        background: var(--bp-danger);
      }

      .ui-stats,
      .ui-costs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px 14px;
      }

      .ui-stats div,
      .ui-costs div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .ui-stats .ui-wide,
      .ui-costs .ui-wide {
        grid-column: 1 / -1;
      }

      .ui-stats b,
      .ui-costs b {
        text-align: right;
      }

      .ui-slots {
        display: grid;
        gap: 4px;
      }

      .ui-slot {
        display: grid;
        grid-template-columns: auto 64px 1fr;
        align-items: center;
        gap: 8px;
      }

      .ui-off b {
        color: var(--bp-muted);
        font-weight: 400;
        font-style: italic;
      }

      .ui-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .ui-chip {
        padding: 3px 8px;
        border: 1px solid var(--bp-rule);
        text-transform: capitalize;
      }

      .ui-chip::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--bp-ink);
        vertical-align: 1px;
      }

      .ui-chip[data-resource="rock"]::before {
        background: #9aa7b8;
      }

      .ui-chip[data-resource="ferrite"]::before {
        background: #e08a4a;
      }

      .ui-chip[data-resource="plasma-crystal"]::before {
        background: #c77dff;
      }

      .ui-chip b {
        margin-left: 4px;
      }

      .ui-keys {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 10px;
      }

      .ui-keys > div {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .ui-keys em {
        font-style: normal;
      }

      .ui-k {
        display: inline-flex;
        gap: 2px;
      }

      .ui-panel kbd {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        font-family: var(--bp-mono);
        font-size: 10.5px;
        font-weight: 600;
        color: var(--bp-ink);
        border: 1px solid var(--bp-ink);
      }

      /* Buttons are outlined in white ink; the active tab is filled. */
      .ui-btn,
      .ui-tab {
        margin: 0;
        padding: 6px 12px;
        font-family: var(--bp-display);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bp-ink);
        background: transparent;
        border: 1px solid var(--bp-ink);
        border-radius: 0;
        cursor: pointer;
      }

      .ui-btn:hover:not([disabled]),
      .ui-tab:hover:not([disabled]) {
        background: rgba(255, 255, 255, 0.12);
      }

      .ui-btn[disabled],
      .ui-tab[disabled] {
        cursor: default;
        opacity: 0.4;
      }

      .ui-small {
        padding: 3px 9px;
        font-size: 10px;
      }

      .ui-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 10px;
        padding: 3px;
        border: 1px solid var(--bp-ink);
        background: var(--bp-track);
      }

      .ui-tab {
        border: 0;
        padding: 7px;
        color: var(--bp-muted);
      }

      .ui-tab.ui-active {
        background: var(--bp-ink);
        color: var(--bp-paper);
      }

      .ui-picker {
        display: grid;
        grid-template-columns: 34px 1fr 34px;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        text-align: center;
      }

      .ui-picker small {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .ui-picker strong {
        font-family: var(--bp-display);
        font-size: 13.5px;
        font-weight: 500;
      }

      .ui-hull strong {
        font-size: 18px;
      }

      .ui-arrow {
        padding: 4px 0;
        font-size: 18px;
        line-height: 1;
      }

      .ui-swap {
        margin: -2px 0 8px;
        text-align: center;
      }

      /* Ship preview: a dashed drawing frame with the real ship art scaled up inside it. */
      .ui-ship {
        display: grid;
        grid-template-columns: 190px 1fr;
        gap: 14px;
        align-items: center;
        padding: 10px 0;
      }

      .ui-preview {
        position: relative;
        height: 130px;
        overflow: hidden;
        border: 1px dashed var(--bp-ink);
      }

      .ui-preview::before {
        content: "";
        position: absolute;
        left: 12%;
        right: 12%;
        top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.6);
      }

      .ui-preview .ship-preview {
        position: absolute;
        inset: 0;
        scale: 1.4;
      }

      .ui-fig {
        position: absolute;
        left: 6px;
        bottom: 4px;
        font-size: 9px;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .ship-preview-sprite {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
        pointer-events: none;
      }

      .ui-shipstats {
        display: grid;
        gap: 4px;
      }

      .ui-stat {
        display: grid;
        grid-template-columns: 52px 1fr 76px;
        align-items: center;
        gap: 8px;
      }

      .ui-stat .ui-bar {
        height: 5px;
        margin: 0;
      }

      .ui-stat b {
        text-align: right;
        font-size: 11.5px;
      }

      .ui-buildtime {
        margin-top: 2px;
        font-size: 11px;
      }

      .ui-buildtime b {
        color: var(--bp-text);
      }

      .ui-mounts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
        grid-auto-flow: column;
        column-gap: 14px;
        padding-top: 10px;
      }

      .ui-hp {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }

      .ui-hp b {
        color: var(--bp-muted);
        font-weight: 400;
      }

      .ui-hp b.ui-fitted {
        color: var(--bp-text);
        font-weight: 600;
      }

      .ui-hp.ui-current span {
        color: var(--bp-ink);
        text-decoration: underline dashed;
        text-underline-offset: 3px;
      }

      .ui-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--bp-ink);
        vertical-align: 1px;
      }

      .ui-dot[data-slot="weapon"] {
        background: #ff6b6b;
      }

      .ui-dot[data-slot="engine"] {
        background: var(--bp-energy);
      }

      .ui-dot[data-slot="utility"],
      .ui-dot[data-slot="support"] {
        background: var(--bp-ok);
      }

      .ui-dot[data-slot="power"] {
        background: #7fc8ff;
      }

      .ui-dot[data-slot="armor"] {
        background: #c9d3de;
      }

      .ui-costs {
        grid-template-columns: 1fr;
        margin-top: 8px;
      }

      .ui-blocker {
        margin-top: 8px;
        padding: 6px 8px;
        color: var(--bp-warn);
        border: 1px dashed var(--bp-warn);
      }

      .ui-primary {
        display: block;
        width: 100%;
        margin: 4px 0 8px;
        padding: 10px;
        font-size: 14px;
        letter-spacing: 0.2em;
      }

      .ui-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        margin-bottom: 5px;
        padding: 7px 10px;
        border: 1px solid var(--bp-rule);
      }

      .ui-card .ui-bar {
        grid-column: 1 / -1;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="ui-panel"></div>
    <div id="minimap"></div>
    <div id="builder" class="ui-panel"></div>
    <div id="notifications"></div>
    <div id="framerate" aria-live="off"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
