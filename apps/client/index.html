<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healer and Destroyer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #152337, #081018 55%, #03070b 100%);
        color: #e9f2ff;
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        background: rgba(5, 10, 16, 0.72);
        border: 1px solid rgba(132, 204, 255, 0.25);
        border-radius: 14px;
        backdrop-filter: blur(12px);
        min-width: 220px;
      }

      #hud.minimized {
        min-width: 180px;
      }

      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .hud-toggle {
        padding: 6px 10px;
        margin: 0;
        font-size: 0.78rem;
      }

      .hud-body {
        display: grid;
        gap: 6px;
      }

      #builder {
        position: fixed;
        right: 16px;
        top: 16px;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 14px;
        border-radius: 8px;
        border: 1px solid rgba(111, 234, 208, 0.25);
        background: rgba(10, 18, 22, 0.78);
        display: none;
      }

      #builder.visible {
        display: block;
      }

      #notifications {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 10px;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      #framerate {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: none;
        color: #ffe45c;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }

      #framerate.visible {
        display: block;
      }

      .toast {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(111, 234, 208, 0.28);
        background: rgba(8, 18, 24, 0.88);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }

      .toast-title {
        margin: 0 0 4px;
        color: #73f3ca;
        font-size: 0.92rem;
      }

      .toast.warning {
        border-color: rgba(255, 140, 107, 0.35);
      }

      .toast.warning .toast-title {
        color: #ffb7a6;
      }

      .toast.success .toast-title {
        color: #73f3ca;
      }

      .toast-body {
        margin: 0;
        color: rgba(233, 242, 255, 0.82);
        font-size: 0.86rem;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        margin: 0 8px 8px 0;
        background: linear-gradient(135deg, #49c6ff, #73f3ca);
        color: #04131c;
        font-weight: 700;
        cursor: pointer;
      }

      button[disabled] {
        cursor: default;
        opacity: 0.45;
        filter: saturate(0.6);
      }

      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8cc8ff;
      }

      .ship-card {
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
      }

      .builder-workstation {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .builder-mode-row,
      .builder-selector {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .builder-selector strong {
        min-width: 150px;
        color: #e9f2ff;
      }

      .ship-card-header {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .ship-preview {
        position: relative;
        width: 132px;
        height: 78px;
        flex: 0 0 132px;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(132, 204, 255, 0.18);
        background:
          radial-gradient(circle at 50% 48%, rgba(79, 198, 255, 0.18), rgba(4, 12, 18, 0) 58%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.01));
      }

      .ship-preview::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 16px 16px;
        opacity: 0.18;
        pointer-events: none;
      }

      .ship-preview-fallback {
        background: linear-gradient(180deg, rgba(73, 198, 255, 0.22), rgba(4, 12, 18, 0.18));
      }

      .ship-preview-sprite {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
        pointer-events: none;
      }

      .ship-preview-copy {
        min-width: 0;
      }

      .ship-part-library {
        display: grid;
        gap: 10px;
        margin-top: 8px;
      }

      .ship-part-gallery {
        display: grid;
        gap: 6px;
      }

      .ship-part-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .ship-part-option {
        padding: 8px;
        border-radius: 12px;
        border: 1px solid rgba(132, 204, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
      }

      .ship-part-swatch {
        display: grid;
        place-items: center;
        height: 58px;
        border-radius: 10px;
        background: radial-gradient(circle at 50% 50%, rgba(79, 198, 255, 0.18), rgba(4, 12, 18, 0.02) 62%);
      }

      .ship-part-swatch img {
        max-width: 100%;
        max-height: 48px;
      }

      .ship-part-name {
        margin-top: 6px;
        font-size: 0.76rem;
        color: rgba(233, 242, 255, 0.82);
      }

      .section-label {
        margin: 14px 0 6px;
        font-size: 0.9rem;
        color: #8cc8ff;
      }

      .build-progress {
        margin: 8px 0;
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .build-progress-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #49c6ff, #73f3ca);
      }

      .muted-copy {
        color: rgba(233, 242, 255, 0.68);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="builder"></div>
    <div id="notifications"></div>
    <div id="framerate" aria-live="off"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
